name: Build Uzbek City GTA APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Detect Project Directory
        id: proj
        run: |
          if [ -f "package.json" ]; then
            echo "dir=." >> $GITHUB_OUTPUT
          elif [ -f "uzbek-city-gta/package.json" ]; then
            echo "dir=uzbek-city-gta" >> $GITHUB_OUTPUT
          else
            echo "::error::package.json topilmadi! package.json, vite.config.js, capacitor.config.json, index.html, src/ va public/models/ fayllarini repozitoriyaga yuklang."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install NPM Dependencies
        working-directory: ${{ steps.proj.outputs.dir }}
        run: npm install

      - name: Copy Three.js Draco Decoders
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          mkdir -p public/draco
          cp -r node_modules/three/examples/jsm/libs/draco/* public/draco/

      - name: Build Vite Web Bundle
        working-directory: ${{ steps.proj.outputs.dir }}
        run: npm run build

      - name: Ensure Draco in dist
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          mkdir -p dist/draco
          cp -r public/draco/* dist/draco/

      - name: Add & Sync Capacitor Android
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Set Screen Orientation in AndroidManifest
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          python3 -c 'import re; p="android/app/src/main/AndroidManifest.xml"; s=open(p).read(); s=s if "hardwareAccelerated" in s else s.replace("<application", "<application android:hardwareAccelerated=\"true\"", 1); s=re.sub(r"android:screenOrientation=\"[^\"]*\"", "android:screenOrientation=\"fullSensor\"", s) if "screenOrientation" in s else s.replace("<activity", "<activity android:screenOrientation=\"fullSensor\"", 1); open(p,"w").write(s)'

      - name: Build Debug APK
        working-directory: ${{ steps.proj.outputs.dir }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Uzbek-City-GTA-APK
          path: ${{ steps.proj.outputs.dir }}/android/app/build/outputs/apk/debug/app-debug.apk
