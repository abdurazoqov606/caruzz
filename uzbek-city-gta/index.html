<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <title>Uzbek City GTA</title>
  <style>
    :root {
      --glass: rgba(15, 23, 42, 0.26);
      --glass-border: rgba(255, 255, 255, 0.24);
      --accent: #00e5ff;
      --gold: #f59e0b;
      --emerald: #10b981;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090e1a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #f8fafc;
      touch-action: none;
    }

    #game-canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    /* Loading Overlay */
    #loading-screen {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #162238 0%, #070b13 100%);
      transition: opacity 0.35s ease;
    }

    #loading-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loading-ring {
      width: 54px;
      height: 54px;
      border: 4px solid rgba(255, 255, 255, 0.14);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Minimal Transparent Icon-Only Top HUD */
    #hud-top {
      position: fixed;
      top: max(12px, env(safe-area-inset-top));
      left: 14px;
      right: 14px;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
    }

    .hud-icons-row {
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: auto;
    }

    .icon-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: var(--glass);
      border: 1.5px solid var(--glass-border);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
      cursor: pointer;
      padding: 0;
      transition: transform 0.1s ease, background 0.2s ease, border-color 0.2s ease;
    }

    .icon-btn:active {
      transform: scale(0.92);
      background: rgba(255, 255, 255, 0.22);
    }

    .icon-btn.active {
      border-color: var(--accent);
      background: rgba(0, 229, 255, 0.22);
    }

    .icon-btn svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    /* Compact Speed + HP Pill (No noisy text) */
    #hud-gauge {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      padding: 6px 14px;
      backdrop-filter: blur(4px);
    }

    #speed-val {
      font-size: 16px;
      font-weight: 900;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
      min-width: 28px;
      text-align: right;
    }

    .hp-track {
      width: 56px;
      height: 6px;
      background: rgba(255, 255, 255, 0.18);
      border-radius: 999px;
      overflow: hidden;
    }

    #car-hp-fill {
      width: 100%;
      height: 100%;
      background: var(--emerald);
      transition: width 0.15s ease, background 0.15s ease;
    }

    /* Right Touch Camera Orbit Zone */
    #camera-touch-zone {
      position: fixed;
      inset: 0;
      z-index: 5;
      touch-action: none;
    }

    /* Left Transparent Virtual Joystick (Walking) */
    #joystick-zone {
      position: fixed;
      left: max(18px, env(safe-area-inset-left));
      bottom: max(18px, env(safe-area-inset-bottom));
      width: 132px;
      height: 132px;
      z-index: 25;
      touch-action: none;
    }

    #joystick-base {
      width: 124px;
      height: 124px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #joystick-stick {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.36);
      border: 1.5px solid rgba(255, 255, 255, 0.7);
      position: absolute;
      pointer-events: none;
    }

    /* Left Transparent Steering Buttons (Driving) */
    #steer-controls {
      position: fixed;
      left: max(18px, env(safe-area-inset-left));
      bottom: max(22px, env(safe-area-inset-bottom));
      z-index: 26;
      display: none;
      align-items: center;
      gap: 14px;
    }

    .steer-btn {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.24);
      border: 1.5px solid rgba(255, 255, 255, 0.34);
      color: rgba(255, 255, 255, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(3px);
      touch-action: none;
    }

    .steer-btn svg {
      width: 30px;
      height: 30px;
      fill: currentColor;
    }

    .steer-btn.pressed {
      background: rgba(0, 229, 255, 0.3);
      border-color: var(--accent);
      transform: scale(0.93);
    }

    /* Right Transparent Controls: Enter/Exit + Horn + Pedals */
    #right-controls {
      position: fixed;
      right: max(18px, env(safe-area-inset-right));
      bottom: max(20px, env(safe-area-inset-bottom));
      z-index: 26;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 14px;
    }

    #enter-exit-btn {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: rgba(245, 158, 11, 0.35);
      border: 2px solid rgba(253, 230, 138, 0.8);
      color: #fff;
      display: none;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
    }

    #enter-exit-btn.visible {
      display: flex;
    }

    #enter-exit-btn svg {
      width: 28px;
      height: 28px;
      fill: currentColor;
    }

    #pedals-row {
      display: none;
      align-items: flex-end;
      gap: 14px;
    }

    .pedal-btn {
      width: 66px;
      border-radius: 18px;
      background: rgba(15, 23, 42, 0.24);
      border: 1.5px solid rgba(255, 255, 255, 0.34);
      color: rgba(255, 255, 255, 0.92);
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(3px);
      touch-action: none;
    }

    #btn-brake {
      height: 76px;
      border-color: rgba(239, 68, 68, 0.6);
    }

    #btn-gas {
      height: 102px;
      border-color: rgba(16, 185, 129, 0.65);
    }

    .pedal-btn svg {
      width: 30px;
      height: 30px;
      fill: currentColor;
    }

    .pedal-btn.pressed {
      transform: scale(0.93);
      background: rgba(255, 255, 255, 0.24);
    }

    /* Tuning Modal */
    #tuning-modal {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(2, 6, 23, 0.72);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    #tuning-modal.open {
      display: flex;
    }

    .modal-card {
      width: min(360px, 92vw);
      background: rgba(15, 23, 42, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 18px;
    }

    .uz-plate-preview {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #ffffff;
      color: #0f172a;
      border: 3px solid #0f172a;
      border-radius: 8px;
      padding: 6px 10px;
      font-family: monospace;
      font-weight: 900;
      font-size: 20px;
      margin: 12px 0;
    }

    .plate-inputs {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .plate-inputs input {
      background: #1e293b;
      border: 1px solid #334155;
      color: #fff;
      padding: 9px 10px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      text-transform: uppercase;
      outline: none;
    }

    #input-region { width: 64px; text-align: center; }
    #input-plate { flex: 1; }

    .color-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 12px 0 16px;
    }

    .color-swatch {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.45);
      cursor: pointer;
    }

    .color-swatch.selected {
      border: 3px solid var(--accent);
      transform: scale(1.12);
    }

    .modal-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .pill-action {
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      padding: 9px 14px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <!-- 360 Touch Camera Orbit Zone -->
  <div id="camera-touch-zone"></div>

  <!-- Clean Spinner Loading Screen -->
  <div id="loading-screen">
    <div class="loading-ring"></div>
  </div>

  <!-- Minimal Transparent Icon-Only Top HUD -->
  <div id="hud-top">
    <div class="hud-icons-row">
      <!-- Camera View Mode: 1st-Person / Close / Far -->
      <button class="icon-btn" id="btn-camera-mode" aria-label="Camera Mode">
        <svg viewBox="0 0 24 24"><path d="M12 5C7 5 2.73 8.11 1 12.5 2.73 16.89 7 20 12 20s9.27-3.11 11-7.5C21.27 8.11 17 5 12 5zm0 12.5a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg>
      </button>

      <!-- Character Switcher (Cyberpunk Women <-> Wladimir) -->
      <button class="icon-btn" id="btn-switch-char" aria-label="Switch Character">
        <svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4zm0 2c-4.42 0-8 1.79-8 4v2h16v-2c0-2.21-3.58-4-8-4z"/></svg>
      </button>
    </div>

    <div id="hud-gauge">
      <span id="speed-val">0</span>
      <div class="hp-track">
        <div id="car-hp-fill"></div>
      </div>
    </div>

    <div class="hud-icons-row">
      <!-- Horn -->
      <button class="icon-btn" id="btn-horn" style="display:none" aria-label="Horn">
        <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
      </button>
      <!-- Tuning (Plate, Color, 180 flip) -->
      <button class="icon-btn" id="btn-tuning" aria-label="Tuning">
        <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 0 0 18c.83 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1.01-.23-.26-.38-.61-.38-.99 0-.83.67-1.5 1.5-1.5H16c2.76 0 5-2.24 5-5 0-4.42-4.03-8-9-8z"/></svg>
      </button>
      <!-- Radio -->
      <button class="icon-btn" id="btn-radio" aria-label="Radio">
        <svg viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
      </button>
      <!-- Repair -->
      <button class="icon-btn" id="btn-repair" style="display:none" aria-label="Repair">
        <svg viewBox="0 0 24 24"><path d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z"/></svg>
      </button>
    </div>
  </div>

  <!-- Left Transparent Joystick (Walking) -->
  <div id="joystick-zone">
    <div id="joystick-base">
      <div id="joystick-stick"></div>
    </div>
  </div>

  <!-- Left Transparent Steering Buttons (Driving) -->
  <div id="steer-controls">
    <button class="steer-btn" id="btn-steer-left" aria-label="Left">
      <svg viewBox="0 0 24 24"><path d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
    </button>
    <button class="steer-btn" id="btn-steer-right" aria-label="Right">
      <svg viewBox="0 0 24 24"><path d="M10 6 8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
    </button>
  </div>

  <!-- Right Transparent Controls: Enter/Exit + Gas/Brake -->
  <div id="right-controls">
    <button id="enter-exit-btn" aria-label="Enter or Exit Car">
      <svg viewBox="0 0 24 24"><path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z"/></svg>
    </button>
    <div id="pedals-row">
      <button class="pedal-btn" id="btn-brake" aria-label="Brake">
        <svg viewBox="0 0 24 24"><path d="M12 16l-6-6h12z"/></svg>
      </button>
      <button class="pedal-btn" id="btn-gas" aria-label="Gas">
        <svg viewBox="0 0 24 24"><path d="M12 8l6 6H6z"/></svg>
      </button>
    </div>
  </div>

  <!-- Tuning Modal -->
  <div id="tuning-modal">
    <div class="modal-card">
      <div class="uz-plate-preview">
        <div>
          <span id="preview-region">01</span> | <span id="preview-plate">A 777 AA</span>
        </div>
        <span style="color:#0284c7;font-size:13px;">UZ</span>
      </div>

      <div class="plate-inputs">
        <input id="input-region" type="text" maxlength="2" value="01" />
        <input id="input-plate" type="text" maxlength="9" value="A 777 AA" />
      </div>

      <div class="color-grid" id="color-grid">
        <div class="color-swatch selected" data-color="#f8fafc" style="background:#f8fafc"></div>
        <div class="color-swatch" data-color="#111827" style="background:#111827"></div>
        <div class="color-swatch" data-color="#94a3b8" style="background:#94a3b8"></div>
        <div class="color-swatch" data-color="#2563eb" style="background:#2563eb"></div>
        <div class="color-swatch" data-color="#dc2626" style="background:#dc2626"></div>
        <div class="color-swatch" data-color="#059669" style="background:#059669"></div>
        <div class="color-swatch" data-color="#f59e0b" style="background:#f59e0b"></div>
      </div>

      <div class="modal-actions">
        <button class="pill-action" id="btn-flip-car">180°</button>
        <div style="display:flex;gap:8px;">
          <button class="pill-action" id="btn-close-tuning">✕</button>
          <button class="pill-action" id="btn-apply-tuning" style="border-color:var(--accent);color:var(--accent)">OK</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
